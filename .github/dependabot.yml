version: 2

# Every configuration below targets `deps`, never main. The auto-merge workflow
# lands a pull request there only after CI has passed on that exact commit; the
# collected result reaches main through one promotion pull request that a human
# merges. See docs/dependency-updates.md.
#
# Monthly, one pull request per directory for every minor and patch bump, and
# one pull request per major. Minor and patch bumps rarely break anything, so
# grouping them costs little. Majors stay separate, so a major that breaks the
# build blocks only itself. Packages that must move together get their own
# group across all update types, so Dependabot never raises one of them alone:
# React with its DOM renderer and type packages, React Router's two packages,
# webpack with its CLI, dev server, plugins and loaders.
#
# Dependabot security updates are switched off for this repository: they always
# target main and would bypass `deps`. security-audit.yml reports advisories
# instead.
#
# CI needs `pull-requests: read` for these pull requests to build at all — see the
# permissions block in ci.yml. Dependabot runs with a restricted token that does
# not grant it by default.
updates:
  - package-ecosystem: "npm"
    directory: "/advanced-frontend-labs/labs/05-webpack-setup"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      webpack:
        patterns: ["webpack", "webpack-*", "*-webpack-plugin", "*-loader"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/advanced-frontend-labs/labs/06-typescript/todo-app"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      webpack:
        patterns: ["webpack", "webpack-*", "*-webpack-plugin", "*-loader"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/advanced-frontend-labs/labs/10-react-routing-and-queries"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      react-router:
        patterns: ["react-router", "react-router-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/advanced-frontend-labs/labs/11-react-typescript-rewrite"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      react-router:
        patterns: ["react-router", "react-router-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # @types/node describes the Node this runs on, and CI provisions Node 20, so
    # a 26.x bump is not an upgrade — it is a description of a runtime nothing
    # here uses. It is also unbuildable: this lab pins typescript ^4.9.5, and
    # tsc 4.9 cannot even parse @types/node 26's declarations, so `npx tsc
    # --noEmit` fails with TS1005 inside node_modules/@types/node/ffi.d.ts.
    # Raise the cap together with the Node version in ci.yml, not before it.
    #
    # react-icons from 5.3 types its components as returning ReactNode, and
    # TypeScript before 5.1 rejects that as a JSX element (TS2786), whatever
    # @types/react says. react-scripts@5.0.1 holds typescript at ^4, so the
    # icon package stays at 5.2.1 — see the README.
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 21.0.0"]
      - dependency-name: "react-icons"
        versions: [">= 5.3.0"]

  - package-ecosystem: "npm"
    directory: "/advanced-frontend-labs/labs/11-react-typescript-rewrite/backend"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/small-fullstack-store-app"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      react-router:
        patterns: ["react-router", "react-router-dom"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "deps"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
