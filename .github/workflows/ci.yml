name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # "every": a file must match every listed pattern for a filter (so
          # the '!backend/**' exclusion under ts-rewrite actually excludes,
          # instead of OR-matching every file that merely isn't in backend/).
          predicate-quantifier: every
          filters: |
            webpack-setup:
              - 'advanced-frontend-labs/labs/05-webpack-setup/**'
            ts-todo-app:
              - 'advanced-frontend-labs/labs/06-typescript/todo-app/**'
            routing-queries:
              - 'advanced-frontend-labs/labs/10-react-routing-and-queries/**'
            ts-rewrite:
              - 'advanced-frontend-labs/labs/11-react-typescript-rewrite/**'
              - '!advanced-frontend-labs/labs/11-react-typescript-rewrite/backend/**'
            ts-rewrite-backend:
              - 'advanced-frontend-labs/labs/11-react-typescript-rewrite/backend/**'
            store-app:
              - 'small-fullstack-store-app/**'

      - name: Build matrix of changed projects
        id: matrix
        uses: actions/github-script@v7
        with:
          script: |
            // project: npm working directory
            // test: has a real test script worth running
            // typecheck: run `tsc --noEmit`
            // lint: run `eslint` (informational only, non-blocking)
            const projects = {
              'webpack-setup': { project: 'advanced-frontend-labs/labs/05-webpack-setup', test: false, typecheck: false, lint: false },
              'ts-todo-app': { project: 'advanced-frontend-labs/labs/06-typescript/todo-app', test: false, typecheck: true, lint: false },
              'routing-queries': { project: 'advanced-frontend-labs/labs/10-react-routing-and-queries', test: true, typecheck: false, lint: true },
              'ts-rewrite': { project: 'advanced-frontend-labs/labs/11-react-typescript-rewrite', test: true, typecheck: true, lint: true },
              'ts-rewrite-backend': { project: 'advanced-frontend-labs/labs/11-react-typescript-rewrite/backend', test: false, typecheck: false, lint: false },
              'store-app': { project: 'small-fullstack-store-app', test: true, typecheck: false, lint: true },
            };
            const changes = JSON.parse('${{ steps.filter.outputs.changes }}');
            return changes.map((key) => projects[key]);

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci --no-audit --no-fund

      - name: Type-check
        if: matrix.typecheck
        working-directory: ${{ matrix.project }}
        run: npx tsc --noEmit

      - name: Lint
        # Informational only: these are old coursework apps with pre-existing
        # warnings, so lint findings shouldn't fail the build on their own.
        if: matrix.lint
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: npx eslint src --ext .js,.jsx,.ts,.tsx

      - name: Build
        working-directory: ${{ matrix.project }}
        # CRA treats eslint warnings as build failures when CI=true; these are
        # old coursework apps with pre-existing lint warnings, not regressions.
        env:
          CI: false
        run: npm run build --if-present

      - name: Test
        if: matrix.test
        working-directory: ${{ matrix.project }}
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests
