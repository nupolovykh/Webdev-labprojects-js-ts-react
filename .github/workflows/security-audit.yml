name: Security audit

# Deliberately NOT part of CI.
#
# `npm audit` answers a question about the global advisory database, not about
# the commit under test. A newly published advisory turns every open pull request
# red at once — including the very bump that fixes it — and in a repository where
# green CI is what merges updates, that stops the updates from landing exactly
# when they matter most. Here it reports on a schedule and blocks nothing.
#
# It is also the one workflow that speaks about `main` itself: Dependabot's
# security updates are switched off in this repository, so this report is the
# only place the whole picture is written down.
#
# The report is the run's summary and its warnings, not an issue. An issue stays
# open until every advisory is fixed, which for coursework may be never, and it
# is one more thing a human has to close. The summary is on the Actions tab of
# every run, and a finding never fails the run.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Projects are discovered rather than listed, so a lab added later is
      # audited without anybody remembering to edit this file. The vendored
      # `cloned-backend/` is skipped: it is third-party code kept for reference
      # and not something this repository can fix — see its NOTICE.md.
      #
      # `npm audit` is run against the lockfile alone. Installing first would
      # need every lab to install on the runner, and a lab that cannot is a
      # blind spot, not a clean result.
      - name: Audit every project
        run: |
          # Explicit: the step's shell is `bash -e`, and this script handles its
          # own failures rather than dying at the first one.
          set +e
          set -uo pipefail
          audited=0
          affected=0
          details=""

          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            case "$dir" in *cloned-backend*) continue;; esac
            echo "::group::${dir}"
            # `if` context, not a bare assignment: GitHub runs this step under
            # `bash -e`, and `npm audit` exits non-zero precisely when it finds
            # something — a plain assignment would kill the script on the first
            # finding, before anything could be reported.
            if report=$(cd "$dir" && npm audit --audit-level=high 2>&1); then
              rc=0
            else
              rc=$?
            fi
            printf '%s\n' "$report"
            audited=$((audited + 1))
            if [ "$rc" -ne 0 ]; then
              affected=$((affected + 1))
              line=$(grep -E '[0-9]+ (vulnerabilit|high|critical)' <<<"$report" | tail -1)
              details="${details}
          - \`${dir}\` — ${line:-see the run log}"
              echo "::warning::advisories at high or above in ${dir}"
            fi
            echo "::endgroup::"
          done < <(find . -name package-lock.json -not -path './.git/*' -not -path '*/node_modules/*' | sort)

          summary="Audited ${audited} project(s); ${affected} carry advisories at high or above."
          echo "$summary"

          # A finding never fails the run: this workflow runs on a schedule
          # against the default branch, so a failure would pin a red check to
          # whatever commit that branch points at — permanently, since a check run
          # cannot be deleted and the mark outlives the fix.
          if [ "$audited" -eq 0 ]; then
            detail="No project could be audited, so this run proves nothing."
            echo "::warning::${detail}"
          elif [ "$affected" -gt 0 ]; then
            detail="${affected} project(s) reference packages with advisories at high or above."
          else
            detail="Nothing at high or above."
          fi

          {
            echo "### Security audit"
            echo
            echo "${detail}"
            if [ -n "${details}" ]; then printf '%s\n' "${details}"; fi
            echo
            echo "${summary}"
          } >>"$GITHUB_STEP_SUMMARY"
